<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <circle cx="16" cy="16" r="15.5" fill="#0d0d0d"/>
  <!-- equator -->
  <ellipse cx="16" cy="16" rx="13" ry="4.5" fill="none" stroke="rgba(210,210,210,0.60)" stroke-width="0.9"/>
  <!-- upper latitude -->
  <ellipse cx="16" cy="11.5" rx="9.5" ry="3.3" fill="none" stroke="rgba(210,210,210,0.38)" stroke-width="0.9"/>
  <!-- lower latitude -->
  <ellipse cx="16" cy="20.5" rx="9.5" ry="3.3" fill="none" stroke="rgba(210,210,210,0.38)" stroke-width="0.9"/>
  <!-- prime meridian -->
  <ellipse cx="16" cy="16" rx="4" ry="13" fill="none" stroke="rgba(210,210,210,0.55)" stroke-width="0.9"/>
  <!-- 60° meridian -->
  <ellipse cx="16" cy="16" rx="6.5" ry="13" fill="none" stroke="rgba(210,210,210,0.35)" stroke-width="0.9"/>
</svg>
